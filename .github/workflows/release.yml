name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          set -e
          pubspec=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml | head -1)
          gradle=$(sed -n 's/.*def appVersionName = "\(.*\)".*/\1/p' android/app/build.gradle)
          dart=$(sed -n 's/.*const appVersionName = "\(.*\)".*/\1/p' lib/foundation/consts.dart)
          tag="${GITHUB_REF_NAME#v}"
          echo "pubspec=$pubspec gradle=$gradle dart=$dart tag=$tag"
          if [ "$pubspec" != "$gradle" ] || [ "$pubspec" != "$dart" ]; then
            echo "::error::版本号三处不一致：请同步 pubspec.yaml / android/app/build.gradle / lib/foundation/consts.dart"
            exit 1
          fi
          if [ "$tag" != "$pubspec" ]; then
            echo "::error::tag ($tag) 与版本号 ($pubspec) 不一致"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Ensure NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;28.0.13004108" > /dev/null 2>&1 || true

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secrets.KEYSTORE_BASE64，请先在仓库 Secrets 中配置签名信息"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/ManComi.jks
          {
            echo "storeFile=ManComi.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
          } > android/key.properties

      - name: Build release APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.0.13004108
        run: |
          flutter pub get
          flutter build apk --release

      - name: Verify APK
        run: |
          aapt=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt | sort | tail -1)
          "$aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | head -1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ManComic ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
